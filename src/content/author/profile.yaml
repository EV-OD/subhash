name: Adv. Subhash Lamichhane
tagline: Driven by Law, Guided by Justice, Committed to Public Service.
bio: >
  A Section Officer (Government Attorney) under the Nepal Judicial Service,
  Government Attorney Group, having secured 1st Rank nationwide (Rank 1) in the
  competitive examination conducted by the Public Service Commission (Lok Sewa
  Aayog), Nepal, on the very first attempt.

  A licensed Advocate under the Nepal Bar Council, holding a B.A.LL.B. degree
  from Bright Vision Law College and currently pursuing an LL.M. at Nepal Law
  Campus. Previously secured a Top 10 nationwide rank in the 33rd Advocate
  License Examination, reflecting consistent academic and professional
  excellence.

  Previously served as a Legal Intern at the Kathmandu District Attorney's
  Office, gaining practical experience in criminal prosecution, legal research,
  and investigation report analysis. 

  Committed to upholding the Constitution, advancing the rule of law, ensuring
  fair and impartial prosecution, and contributing to a justice system founded
  on integrity, accountability, and public trust.
